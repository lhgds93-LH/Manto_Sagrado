name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://manto:manto_local@localhost:5432/manto_sagrado
      ADMIN_API_KEY: ci-admin-key-not-for-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @manto-sagrado/api prisma:generate

      - name: Typecheck contracts
        run: pnpm --filter @manto-sagrado/contracts typecheck

      - name: Build API
        id: api_build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @manto-sagrado/api build 2>&1 | tee api-build.log

      - name: Upload API log on failure
        if: steps.api_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: api-build-log
          path: api-build.log

      - name: Build storefront
        id: storefront_build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @manto-sagrado/storefront build 2>&1 | tee storefront-build.log

      - name: Upload storefront log on failure
        if: steps.storefront_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: storefront-build-log
          path: storefront-build.log

      - name: Build admin
        id: admin_build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @manto-sagrado/admin build 2>&1 | tee admin-build.log

      - name: Upload admin log on failure
        if: steps.admin_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: admin-build-log
          path: admin-build.log

      - name: Confirm build results
        if: always()
        env:
          API_RESULT: ${{ steps.api_build.outcome }}
          STOREFRONT_RESULT: ${{ steps.storefront_build.outcome }}
          ADMIN_RESULT: ${{ steps.admin_build.outcome }}
        run: |
          echo "API: $API_RESULT"
          echo "Storefront: $STOREFRONT_RESULT"
          echo "Admin: $ADMIN_RESULT"
          test "$API_RESULT" = "success"
          test "$STOREFRONT_RESULT" = "success"
          test "$ADMIN_RESULT" = "success"

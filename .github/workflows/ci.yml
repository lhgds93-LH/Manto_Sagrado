name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://manto:manto_local@localhost:5432/manto_sagrado
      ADMIN_API_KEY: ci-admin-key-not-for-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate clean App Hosting lockfiles
        run: |
          rm -rf /tmp/storefront-lock /tmp/admin-lock
          mkdir -p /tmp/storefront-lock /tmp/admin-lock

          cp apps/storefront/package.json /tmp/storefront-lock/package.json
          cd /tmp/storefront-lock
          npm install --package-lock-only --ignore-scripts
          cp package-lock.json "$GITHUB_WORKSPACE/apps/storefront/package-lock.json"

          cp "$GITHUB_WORKSPACE/apps/admin/package.json" /tmp/admin-lock/package.json
          cd /tmp/admin-lock
          npm install --package-lock-only --ignore-scripts
          cp package-lock.json "$GITHUB_WORKSPACE/apps/admin/package-lock.json"

      - name: Upload App Hosting lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: apphosting-lockfiles
          path: |
            apps/storefront/package-lock.json
            apps/admin/package-lock.json
          retention-days: 7

      - name: Generate Prisma Client
        run: pnpm --filter @manto-sagrado/api prisma:generate

      - name: Generate initial migration SQL
        run: |
          mkdir -p /tmp/manto-migration
          pnpm --filter @manto-sagrado/api exec prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.prisma \
            --script \
            --output /tmp/manto-migration/migration.sql

      - name: Upload initial migration SQL
        uses: actions/upload-artifact@v4
        with:
          name: prisma-initial-migration
          path: /tmp/manto-migration/migration.sql
          retention-days: 7

      - name: Typecheck contracts
        run: pnpm --filter @manto-sagrado/contracts typecheck

      - name: Build API
        run: pnpm --filter @manto-sagrado/api build

      - name: Build storefront
        run: pnpm --filter @manto-sagrado/storefront build

      - name: Build admin
        run: pnpm --filter @manto-sagrado/admin build

      - name: Build Cloud Run image
        run: docker build --file apps/api/Dockerfile --tag manto-sagrado-api:ci .

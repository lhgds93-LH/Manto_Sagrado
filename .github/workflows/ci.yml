name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://manto:manto_local@localhost:5432/manto_sagrado
      ADMIN_API_KEY: ci-admin-key-not-for-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @manto-sagrado/api prisma:generate

      - name: Generate initial migration SQL
        run: |
          mkdir -p /tmp/manto-migration
          pnpm --filter @manto-sagrado/api exec prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.prisma \
            --script \
            --output /tmp/manto-migration/migration.sql

      - name: Upload initial migration SQL
        uses: actions/upload-artifact@v4
        with:
          name: prisma-initial-migration
          path: /tmp/manto-migration/migration.sql
          retention-days: 7

      - name: Typecheck contracts
        run: pnpm --filter @manto-sagrado/contracts typecheck

      - name: Build API
        run: pnpm --filter @manto-sagrado/api build

      - name: Validate Firebase single-file runtime exactly
        run: |
          rm -rf dist /tmp/firebase-runtime
          npm run apphosting:build
          node --check server.mjs

          mkdir -p /tmp/firebase-runtime
          cp server.mjs /tmp/firebase-runtime/server.mjs

          cd /tmp/firebase-runtime
          PORT=8080 node server.mjs > /tmp/manto-storefront.log 2>&1 &
          APP_PID=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /tmp/manto-home.html; then
              grep -q "Manto Sagrado" /tmp/manto-home.html
              curl --fail --silent http://127.0.0.1:8080/app.js > /tmp/manto-app.js
              grep -q "renderProducts" /tmp/manto-app.js
              kill $APP_PID
              wait $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/manto-storefront.log
          kill $APP_PID || true
          exit 1

      - name: Build admin
        run: pnpm --filter @manto-sagrado/admin build

      - name: Build Cloud Run image
        run: docker build --file apps/api/Dockerfile --tag manto-sagrado-api:ci .

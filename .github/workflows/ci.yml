name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://manto:manto_local@localhost:5432/manto_sagrado
      ADMIN_API_KEY: ci-admin-key-not-for-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Google Cloud provisioner
        run: |
          bash -n scripts/provision-gcp-production.sh
          bash -n scripts/resume-gcp-production.sh
          bash -n apps/api/docker-entrypoint.sh

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @manto-sagrado/api prisma:generate

      - name: Generate initial migration SQL
        run: |
          mkdir -p /tmp/manto-migration
          pnpm --filter @manto-sagrado/api exec prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.prisma \
            --script \
            --output /tmp/manto-migration/migration.sql

      - name: Upload initial migration SQL
        uses: actions/upload-artifact@v4
        with:
          name: prisma-initial-migration
          path: /tmp/manto-migration/migration.sql
          retention-days: 7

      - name: Typecheck contracts
        run: pnpm --filter @manto-sagrado/contracts typecheck

      - name: Build API
        run: pnpm --filter @manto-sagrado/api build

      - name: Validate Firebase commerce runtime exactly
        env:
          PUBLIC_API_URL: http://127.0.0.1:9090
        run: |
          set -Eeuo pipefail
          cleanup() {
            kill "${APP_PID:-}" >/dev/null 2>&1 || true
            kill "${MOCK_PID:-}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          rm -rf dist /tmp/firebase-runtime
          node --check apps/storefront/static/app.js
          node --check apps/storefront/server-template.mjs
          node --check apphosting-build.mjs
          npm run apphosting:build
          node --check server.mjs

          cat > /tmp/mock-api.mjs <<'MOCK'
          import { createServer } from "node:http";

          const product = {
            id: "ci-product-1",
            sku: "MS-CI-001",
            slug: "camisa-ci",
            name: "Camisa CI",
            description: "Produto usado para validar o proxy interno.",
            category: "BRASILEIRAO",
            price: 149.9,
            compareAtPrice: 179.9,
            imageUrl: null,
            badge: "Teste",
            variants: [{ id: "ci-variant-1", size: "M", stock: 10 }]
          };

          createServer(async (request, response) => {
            if (request.method === "GET" && request.url === "/v1/products") {
              const body = Buffer.from(JSON.stringify([product]));
              response.writeHead(200, { "content-type": "application/json", "content-length": body.length });
              response.end(body);
              return;
            }

            if (request.method === "POST" && request.url === "/v1/orders") {
              for await (const _chunk of request) void _chunk;
              const body = Buffer.from(JSON.stringify({
                number: "MS-CI-001",
                status: "AWAITING_PAYMENT",
                paymentStatus: "PENDING",
                total: 149.9
              }));
              response.writeHead(201, { "content-type": "application/json", "content-length": body.length });
              response.end(body);
              return;
            }

            response.writeHead(404, { "content-type": "application/json" });
            response.end(JSON.stringify({ message: "Rota não encontrada" }));
          }).listen(9090, "127.0.0.1");
          MOCK

          node /tmp/mock-api.mjs > /tmp/manto-mock-api.log 2>&1 &
          MOCK_PID=$!

          mkdir -p /tmp/firebase-runtime
          cp server.mjs /tmp/firebase-runtime/server.mjs

          cd /tmp/firebase-runtime
          PORT=8080 PUBLIC_API_URL=http://127.0.0.1:9090 node server.mjs > /tmp/manto-storefront.log 2>&1 &
          APP_PID=$!

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /tmp/manto-home.html; then
              grep -q "checkout-form" /tmp/manto-home.html
              grep -q "Meus pedidos" /tmp/manto-home.html
              curl --fail --silent http://127.0.0.1:8080/app.js > /tmp/manto-app.js
              grep -q "submitOrder" /tmp/manto-app.js
              curl --fail --silent http://127.0.0.1:8080/runtime-config.js > /tmp/manto-config.js
              grep -q 'apiUrl: "/api"' /tmp/manto-config.js
              curl --fail --silent http://127.0.0.1:8080/api/v1/products > /tmp/manto-products.json
              grep -q '"MS-CI-001"' /tmp/manto-products.json
              curl --fail --silent \
                --request POST \
                --header 'content-type: application/json' \
                --data '{"customer":{"name":"Cliente CI"},"items":[]}' \
                http://127.0.0.1:8080/api/v1/orders > /tmp/manto-order.json
              grep -q '"MS-CI-001"' /tmp/manto-order.json
              curl --fail --silent http://127.0.0.1:8080/healthz > /tmp/manto-health.json
              grep -q '"status":"ok"' /tmp/manto-health.json
              grep -q '"apiConfigured":true' /tmp/manto-health.json
              exit 0
            fi
            sleep 1
          done

          cat /tmp/manto-storefront.log
          cat /tmp/manto-mock-api.log
          exit 1

      - name: Build admin
        run: pnpm --filter @manto-sagrado/admin build

      - name: Build Cloud Run image
        run: docker build --file apps/api/Dockerfile --tag manto-sagrado-api:ci .

      - name: Validate Cloud Run container startup exactly
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker rm -f manto-api manto-postgres >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name manto-postgres \
            --env POSTGRES_USER=manto \
            --env POSTGRES_PASSWORD=manto_local \
            --env POSTGRES_DB=manto_sagrado \
            --network host \
            postgres:16-alpine

          for attempt in {1..30}; do
            if docker exec manto-postgres pg_isready -U manto -d manto_sagrado >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              docker logs manto-postgres
              exit 1
            fi
            sleep 1
          done

          docker run --rm --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            --entrypoint bash \
            manto-sagrado-api:ci \
            -lc "pnpm --filter @manto-sagrado/api prisma:deploy && pnpm --filter @manto-sagrado/api prisma:seed"

          docker run --detach --name manto-api \
            --network host \
            --env PORT=8080 \
            --env DATABASE_URL="$DATABASE_URL" \
            --env ADMIN_API_KEY="$ADMIN_API_KEY" \
            --env CORS_ORIGINS="$CORS_ORIGINS" \
            manto-sagrado-api:ci

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8080/v1/health > /tmp/manto-api-health.json; then
              grep -q '"status":"ok"' /tmp/manto-api-health.json
              docker logs manto-api
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' manto-api 2>/dev/null | grep -qx true; then
              docker logs manto-api
              exit 1
            fi
            sleep 1
          done

          docker logs manto-api
          exit 1

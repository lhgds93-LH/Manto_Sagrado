# Firebase App Hosting — loja pública Manto Sagrado
# O backend deve apontar o diretório raiz para apps/storefront.
# A loja é exportada como arquivos estáticos e servida por Node puro,
# sem depender do adaptador Next.js durante a execução.
scripts:
  buildCommand: npm run build
  runCommand: node server.mjs

outputFiles:
  serverApp:
    include:
      - out
      - server.mjs
      - package.json

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

availability:
  cpu: true
  memory: true

env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

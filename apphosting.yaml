# Firebase App Hosting — configuração na raiz real usada pelo backend.
# O backend atual foi criado apontando para a raiz do repositório.
scripts:
  buildCommand: npm run apphosting:build
  runCommand: npm run start

outputFiles:
  serverApp:
    include:
      - apps/storefront/out
      - apps/storefront/server.mjs
      - apps/storefront/package.json

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

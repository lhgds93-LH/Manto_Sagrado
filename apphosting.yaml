# Firebase App Hosting — loja pública executada diretamente na raiz.
scripts:
  buildCommand: npm run apphosting:build
  runCommand: node server.mjs

outputFiles:
  serverApp:
    include:
      - dist
      - server.mjs

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

# Firebase App Hosting — loja pública em um único servidor autossuficiente.
scripts:
  buildCommand: npm run apphosting:build
  runCommand: node server.mjs

outputFiles:
  serverApp:
    include:
      - server.mjs

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME
  - variable: PUBLIC_API_URL
    value: https://manto-sagrado-api-geurgzus5q-uk.a.run.app
    availability:
      - RUNTIME
